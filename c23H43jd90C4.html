<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Example</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: #000;
                cursor: pointer;
            }

            .fullscreen-video {
                position: fixed;
                top: 50%;
                left: 50%;
                min-width: 100%;
                min-height: 100%;
                width: auto;
                height: auto;
                transform: translate(-50%, -50%);
                object-fit: cover;
                z-index: 1;
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 2;
                background: transparent;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .click-text {
                color: #ffffff;
                font-family: sans-serif;
                font-size: 2rem;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 2px;
                user-select: none;
            }
        </style>
    </head>
    <body>
        <div class="overlay" id="trigger-overlay">
            <div class="click-text" id="prompt-text">click me</div>
        </div>

        <video class="fullscreen-video" loop id="rickvideo">
            <source src="/assets/c23H43jd90C4.webm" type="video/webm" />
        </video>

        <script>
            const video = document.getElementById("rickvideo");
            const text = document.getElementById("prompt-text");

            document.addEventListener(
                "click",
                function () {
                    text.style.display = "none";
                    video.play().catch(function (error) {
                        console.log("Error:", error);
                    });
                },
                { once: true },
            );
        </script>
    </body>
</html>
